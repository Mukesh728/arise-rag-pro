<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arise.ai — Create Account / Sign In</title>
  <style>
    :root {
      --navy-dark: #0E1626;
      --navy-base: #14213D;
      --navy-panel: #1B2A4A;
      --slate-blue: #5E7BA8;
      --pale-blue: #B8C4D9;
      --cream: #F6EBC8;
      --cyan: #35C6E8;
      --cyan-glow: rgba(53, 198, 232, 0.35);
      --teal: #4FE0C8;
      --teal-hover: #5efadc;
      --frosted-bg: rgba(255, 255, 255, 0.12);
      --frosted-border: rgba(255, 255, 255, 0.18);
      --frosted-hover: rgba(255, 255, 255, 0.16);
      --error-bg: rgba(244, 63, 94, 0.14);
      --error-border: rgba(244, 63, 94, 0.3);
      --error-text: #fda4af;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      min-height: 100vh;
      background: var(--navy-dark);
      background: radial-gradient(1000px 700px at 50% 10%, #1B2A4A 0%, #0E1626 100%);
      color: var(--pale-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Main Container Card */
    .portal-card {
      position: relative;
      width: 100%;
      max-width: 1080px;
      min-height: 660px;
      border-radius: 32px;
      overflow: hidden;
      background: var(--navy-panel);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
    }

    /* Background Misty Mountain/Forest Artwork (Pure SVG & CSS gradients) */
    .portal-bg-artwork {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .portal-bg-artwork svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Top Bar */
    .portal-topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 32px 44px 16px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
    }

    .cyan-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .brand-title span {
      color: var(--cyan);
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .top-nav a,
    .top-nav button {
      background: none;
      border: none;
      color: var(--pale-blue);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s ease, opacity 0.2s ease;
      padding: 4px 0;
    }

    .top-nav a:hover,
    .top-nav button:hover {
      color: var(--cream);
    }

    .top-nav .nav-join {
      color: var(--cyan);
      font-weight: 600;
    }

    /* Content Area */
    .portal-content {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 24px 44px;
      width: 100%;
    }

    .auth-box {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .eyebrow {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--pale-blue);
      opacity: 0.85;
      margin-bottom: 8px;
    }

    .auth-heading {
      font-size: 34px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--cream);
      margin-bottom: 8px;
    }

    .auth-heading .dot {
      color: var(--cyan);
    }

    .auth-subtext {
      font-size: 13.5px;
      color: var(--pale-blue);
      margin-bottom: 22px;
      line-height: 1.45;
    }

    .link-cyan {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: none;
      font-size: inherit;
      display: inline;
      padding: 0;
      transition: opacity 0.2s ease;
    }

    .link-cyan:hover {
      opacity: 0.85;
      text-decoration: underline;
    }

    /* Error Message Box */
    .auth-error-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 11px 16px;
      border-radius: 14px;
      font-size: 13px;
      margin-bottom: 18px;
      animation: fadeIn 0.2s ease;
    }

    .auth-error-box svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    /* Form Fields */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .frosted-field {
      position: relative;
      background: var(--frosted-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--frosted-border);
      border-radius: 16px;
      padding: 9px 16px 8px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .frosted-field:focus-within {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px var(--cyan-glow);
      background: var(--frosted-hover);
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--pale-blue);
      opacity: 0.85;
      margin-bottom: 2px;
      letter-spacing: 0.01em;
      pointer-events: none;
    }

    .field-control {
      display: flex;
      align-items: center;
      position: relative;
    }

    .field-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 500;
      padding: 2px 0;
    }

    .field-input::placeholder {
      color: rgba(184, 196, 217, 0.4);
    }

    .field-icon {
      width: 18px;
      height: 18px;
      stroke: var(--pale-blue);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.7;
      margin-left: 10px;
      flex-shrink: 0;
    }

    .btn-toggle-eye {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      color: var(--pale-blue);
      display: flex;
      align-items: center;
      margin-left: 10px;
      opacity: 0.7;
      transition: opacity 0.2s ease, color 0.2s ease;
    }

    .btn-toggle-eye:hover {
      opacity: 1;
      color: var(--cyan);
    }

    .btn-toggle-eye svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }

    /* Action Buttons Row */
    .actions-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .btn-change-method {
      flex: 1;
      background: var(--frosted-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--frosted-border);
      color: var(--cream);
      border-radius: 9999px;
      padding: 13px 20px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .btn-change-method:hover {
      background: var(--frosted-hover);
      transform: translateY(-1px);
    }

    .btn-change-method:active {
      transform: translateY(0);
    }

    .btn-primary-teal {
      flex: 1.35;
      background: var(--teal);
      color: #0E1626;
      border: none;
      border-radius: 9999px;
      padding: 13px 24px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(79, 224, 200, 0.35);
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .btn-primary-teal:hover {
      background: var(--teal-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(79, 224, 200, 0.45);
    }

    .btn-primary-teal:active {
      transform: translateY(0);
    }

    .btn-primary-teal:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .auth-spinner {
      width: 15px;
      height: 15px;
      border: 2px solid #0E1626;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Accessibility: Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Responsive */
    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      .portal-card {
        border-radius: 24px;
        min-height: auto;
      }

      .portal-topbar {
        padding: 24px 20px 10px;
      }

      .portal-content {
        padding: 20px 16px 36px;
      }

      .auth-heading {
        font-size: 28px;
      }

      .name-row {
        grid-template-columns: 1fr;
      }

      .actions-row {
        flex-direction: column-reverse;
      }

      .btn-change-method,
      .btn-primary-teal {
        width: 100%;
        flex: none;
      }
    }
  </style>
</head>
<body>

  <main class="portal-card" id="portal-card">
    
    <!-- Misty Mountain / Forest SVG Artwork -->
    <div class="portal-bg-artwork" aria-hidden="true">
      <svg viewBox="0 0 1200 800" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Sky Gradient: Deep Navy to Slate Blue to Pale Blue -->
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#14213D" />
            <stop offset="35%" stop-color="#1B2A4A" />
            <stop offset="68%" stop-color="#5E7BA8" />
            <stop offset="100%" stop-color="#B8C4D9" />
          </linearGradient>

          <!-- Soft Mountain Gradient Layer 1 -->
          <linearGradient id="mtnGrad1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5E7BA8" stop-opacity="0.6" />
            <stop offset="100%" stop-color="#1B2A4A" stop-opacity="0.85" />
          </linearGradient>

          <!-- Mountain Gradient Layer 2 -->
          <linearGradient id="mtnGrad2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3F597F" />
            <stop offset="100%" stop-color="#14213D" />
          </linearGradient>

          <!-- Foreground Ridge / Forest Gradient -->
          <linearGradient id="forestGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#24344D" />
            <stop offset="100%" stop-color="#0E1626" />
          </linearGradient>

          <!-- Horizontal Fog Overlay -->
          <linearGradient id="fogGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#B8C4D9" stop-opacity="0.32" />
            <stop offset="50%" stop-color="#5E7BA8" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#14213D" stop-opacity="0" />
          </linearGradient>

          <!-- Vignette / Atmospheric Depth -->
          <radialGradient id="vignetteGrad" cx="50%" cy="30%" r="55%">
            <stop offset="0%" stop-color="#B8C4D9" stop-opacity="0.18" />
            <stop offset="70%" stop-color="#14213D" stop-opacity="0.75" />
            <stop offset="100%" stop-color="#0E1626" stop-opacity="0.9" />
          </radialGradient>
        </defs>

        <!-- Sky Base -->
        <rect width="1200" height="800" fill="url(#skyGrad)" />

        <!-- Distant Mountain Ridge -->
        <path d="M0,490 Q220,360 440,430 T880,350 T1200,410 L1200,800 L0,800 Z" fill="url(#mtnGrad1)" />

        <!-- Mid Mountain Ridge -->
        <path d="M0,540 Q180,410 400,490 T850,390 T1200,470 L1200,800 L0,800 Z" fill="url(#mtnGrad2)" />

        <!-- Misty Fog Layer -->
        <rect x="0" y="400" width="1200" height="220" fill="url(#fogGrad)" />

        <!-- Foreground Forest Ridge Silhouettes -->
        <path d="M0,640 Q140,570 310,610 T720,560 T1040,600 T1200,570 L1200,800 L0,800 Z" fill="url(#forestGrad)" />

        <!-- Stylized Pine Tree Accents along Ridges -->
        <g fill="#14213D" opacity="0.75">
          <polygon points="120,590 114,625 126,625" />
          <polygon points="128,580 121,620 135,620" />
          <polygon points="138,595 133,628 143,628" />
          <polygon points="340,600 334,635 346,635" />
          <polygon points="352,588 345,630 359,630" />
          <polygon points="760,550 753,595 767,595" />
          <polygon points="772,542 764,590 780,590" />
          <polygon points="785,556 779,598 791,598" />
          <polygon points="1060,590 1054,628 1066,628" />
          <polygon points="1072,578 1064,624 1080,624" />
        </g>

        <!-- Dashed Curved Decorative Line in White (Opacity ~0.5) -->
        <path d="M -40,240 C 240,110 480,420 860,190 C 1040,80 1140,260 1260,210"
              fill="none"
              stroke="#FFFFFF"
              stroke-dasharray="6,8"
              stroke-width="2.2"
              opacity="0.5" />

        <!-- Atmosphere Vignette Overlay -->
        <rect width="1200" height="800" fill="url(#vignetteGrad)" />
      </svg>
    </div>

    <!-- Top Bar -->
    <header class="portal-topbar">
      <a href="/" class="brand-group" aria-label="Arise.ai Homepage">
        <span class="cyan-dot"></span>
        <span class="brand-title">Arise<span>.ai</span></span>
      </a>

      <nav class="top-nav" aria-label="Portal Navigation">
        <a href="/" class="nav-link">Home</a>
        <button type="button" class="nav-link nav-join" id="nav-join-btn">Join</button>
      </nav>
    </header>

    <!-- Main Content Form Section -->
    <section class="portal-content">
      <div class="auth-box">

        <!-- Eyebrow & Main Headings -->
        <p class="eyebrow" id="auth-eyebrow">START FOR FREE</p>
        <h1 class="auth-heading" id="auth-title">Create new account<span class="dot">.</span></h1>
        
        <p class="auth-subtext" id="auth-subtext-container">
          <span id="auth-subtext-label">Already a member?</span>
          <button type="button" class="link-cyan" id="auth-toggle-btn">Log in</button>
        </p>

        <!-- Error Banner -->
        <div class="auth-error-box" id="auth-error" role="alert" style="display: none;">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="auth-error-msg">Invalid email or password</span>
        </div>

        <!-- Auth Form -->
        <form class="auth-form" id="auth-form" novalidate>

          <!-- First & Last Name (Visible in Register mode) -->
          <div class="name-row" id="name-fields-row">
            <div class="frosted-field">
              <label for="auth-first-name" class="field-label">First name</label>
              <div class="field-control">
                <input type="text" id="auth-first-name" class="field-input" placeholder="e.g. John" autocomplete="given-name">
                <svg class="field-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
            </div>

            <div class="frosted-field">
              <label for="auth-last-name" class="field-label">Last name</label>
              <div class="field-control">
                <input type="text" id="auth-last-name" class="field-input" placeholder="e.g. Doe" autocomplete="family-name">
                <svg class="field-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
            </div>
          </div>

          <!-- Email Field -->
          <div class="frosted-field">
            <label for="auth-email" class="field-label">Email address</label>
            <div class="field-control">
              <input type="email" id="auth-email" class="field-input" placeholder="student@mrsptu.ac.in" required autocomplete="email">
              <svg class="field-icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </div>
          </div>

          <!-- Password Field -->
          <div class="frosted-field">
            <label for="auth-password" class="field-label">Password</label>
            <div class="field-control">
              <input type="password" id="auth-password" class="field-input" placeholder="••••••••" required minlength="8" autocomplete="current-password">
              <button type="button" class="btn-toggle-eye" id="btn-toggle-password" aria-label="Toggle password visibility">
                <svg viewBox="0 0 24 24" id="eye-icon">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Two Pill Action Buttons -->
          <div class="actions-row">
            <button type="button" class="btn-change-method" id="btn-change-method">Change method</button>
            <button type="submit" class="btn-primary-teal" id="auth-submit">
              <span class="auth-spinner" id="auth-spinner" style="display: none;"></span>
              <span id="auth-btn-text">Create account</span>
            </button>
          </div>

        </form>

      </div>
    </section>

  </main>

  <script>
    (function () {
      let isSignupMode = true; // Default matches screenshot: "Create new account."
      let allowSignup = true;

      // DOM Elements
      const authForm = document.getElementById("auth-form");
      const authTitle = document.getElementById("auth-title");
      const authEyebrow = document.getElementById("auth-eyebrow");
      const authSubtextLabel = document.getElementById("auth-subtext-label");
      const authToggleBtn = document.getElementById("auth-toggle-btn");
      const nameFieldsRow = document.getElementById("name-fields-row");
      const authEmail = document.getElementById("auth-email");
      const authPassword = document.getElementById("auth-password");
      const authSubmit = document.getElementById("auth-submit");
      const authBtnText = document.getElementById("auth-btn-text");
      const authSpinner = document.getElementById("auth-spinner");
      const authError = document.getElementById("auth-error");
      const authErrorMsg = document.getElementById("auth-error-msg");
      const btnTogglePassword = document.getElementById("btn-toggle-password");
      const eyeIcon = document.getElementById("eye-icon");
      const btnChangeMethod = document.getElementById("btn-change-method");
      const navJoinBtn = document.getElementById("nav-join-btn");

      // Password Visibility Toggle
      if (btnTogglePassword && authPassword && eyeIcon) {
        btnTogglePassword.addEventListener("click", () => {
          const isPassword = authPassword.type === "password";
          authPassword.type = isPassword ? "text" : "password";
          eyeIcon.innerHTML = isPassword
            ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`
            : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
        });
      }

      function showError(msg) {
        authErrorMsg.textContent = msg || "An unexpected error occurred.";
        authError.style.display = "flex";
      }

      function hideError() {
        authError.style.display = "none";
      }

      function setMode(signup) {
        isSignupMode = signup;
        hideError();

        if (isSignupMode) {
          authEyebrow.textContent = "START FOR FREE";
          authTitle.innerHTML = 'Create new account<span class="dot">.</span>';
          authSubtextLabel.textContent = "Already a member?";
          authToggleBtn.textContent = "Log in";
          authBtnText.textContent = "Create account";
          if (nameFieldsRow) nameFieldsRow.style.display = "grid";
        } else {
          authEyebrow.textContent = "WELCOME BACK";
          authTitle.innerHTML = 'Welcome back<span class="dot">.</span>';
          authSubtextLabel.textContent = "Don't have an account?";
          authToggleBtn.textContent = "Create account";
          authBtnText.textContent = "Log in";
          if (nameFieldsRow) nameFieldsRow.style.display = "none";
        }
      }

      // Toggle link click
      if (authToggleBtn) {
        authToggleBtn.addEventListener("click", (e) => {
          e.preventDefault();
          if (!allowSignup && !isSignupMode) return;
          setMode(!isSignupMode);
        });
      }

      // Top nav Join click
      if (navJoinBtn) {
        navJoinBtn.addEventListener("click", (e) => {
          e.preventDefault();
          setMode(true);
        });
      }

      // Secondary "Change method" button click
      if (btnChangeMethod) {
        btnChangeMethod.addEventListener("click", () => {
          // Toggle between modes or prompt method options
          setMode(!isSignupMode);
        });
      }

      // Check system configuration
      async function checkConfig() {
        try {
          const res = await fetch("/api/auth/config");
          if (res.ok) {
            const data = await res.json();
            allowSignup = data.allow_signup !== false;
            if (!allowSignup) {
              setMode(false);
              const subtextContainer = document.getElementById("auth-subtext-container");
              if (subtextContainer) subtextContainer.style.display = "none";
              if (navJoinBtn) navJoinBtn.style.display = "none";
            }
          }
        } catch (e) {
          // Keep defaults if config endpoint unavailable
        }
      }
      checkConfig();

      // Form submission
      authForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();

        const email = authEmail.value.trim();
        const password = authPassword.value;

        if (!email || !password) {
          showError("Please enter both email and password.");
          return;
        }

        if (password.length < 8) {
          showError("Password must be at least 8 characters.");
          return;
        }

        const endpoint = isSignupMode ? "/api/auth/register" : "/api/auth/login";

        authSubmit.disabled = true;
        authSpinner.style.display = "inline-block";
        authBtnText.textContent = isSignupMode ? "Creating account..." : "Logging in...";

        try {
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            showError(data.detail || "Authentication request failed.");
            return;
          }

          // Successfully authenticated -> redirect to main app
          window.location.href = "/";
        } catch (err) {
          showError("Network connection error. Please try again.");
        } finally {
          authSubmit.disabled = false;
          authSpinner.style.display = "none";
          authBtnText.textContent = isSignupMode ? "Create account" : "Log in";
        }
      });
    })();
  </script>
</body>
</html>
